# 打 tag（v*）或手动触发：双端测试 → 打包 portable exe → 发布到 Releases
name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 扩展：构建与测试
        shell: pwsh
        run: |
          cd extension
          npm install
          npm run build
          npm test

      - name: 扩展：打包 zip（只含运行时文件，供手动加载）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-ext | Out-Null
          Copy-Item extension\manifest.json, extension\popup.html, extension\popup.css, extension\page-hook.js dist-ext\
          Copy-Item extension\dist dist-ext\dist -Recurse
          tar -a -c -f extension.zip -C dist-ext .

      - name: 桌面端：测试
        shell: pwsh
        run: |
          cd desktop
          npm install
          npm test

      - name: 桌面端：打包 portable exe（单文件便携版）
        shell: pwsh
        run: |
          cd desktop
          npx electron-builder --win portable

      - name: 桌面端：打包免安装目录版（win-unpacked zip）
        shell: pwsh
        run: |
          cd desktop
          npx electron-builder --win dir
          tar -a -c -f xiuxiu-desktop-dir.zip -C dist win-unpacked

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xiuxiu-build
          path: |
            desktop/dist/*-portable.exe
            desktop/xiuxiu-desktop-dir.zip
            extension.zip

      - name: 发布 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*-portable.exe
            desktop/xiuxiu-desktop-dir.zip
            extension.zip
          generate_release_notes: true
