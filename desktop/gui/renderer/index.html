<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>嗅探下载器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>嗅探下载器</h1>
    <nav>
      <button id="tab-dl" class="tab active" type="button">下载</button>
      <button id="tab-cap" class="tab" type="button">扩展捕获 <span id="cap-count">0</span></button>
    </nav>
  </header>

  <main id="view-dl">
    <form id="add-form">
      <input id="f-url" class="grow" placeholder="粘贴 http(s) 链接（直链 / m3u8 / mpd），也可直接拖入" required>
      <select id="f-kind" title="任务类型">
        <option value="auto">自动识别</option>
        <option value="file">直链</option>
        <option value="media">流媒体</option>
      </select>
      <input id="f-threads" type="number" min="1" max="32" value="8" title="线程数">
      <input id="f-limit" type="number" min="0" step="64" value="0" title="限速 KB/s（0 = 不限）">
      <button type="submit" id="f-add">添加下载</button>
    </form>
    <details id="f-headers">
      <summary>请求头（防盗链/登录站点用，可从「扩展捕获」一键带入）</summary>
      <div class="hdr-row"><label>Cookie</label><input id="f-cookie" placeholder="可选"></div>
      <div class="hdr-row"><label>Referer</label><input id="f-referer" placeholder="可选"></div>
      <div class="hdr-row"><label>User-Agent</label><input id="f-ua" placeholder="可选"></div>
    </details>
    <div id="tasks"></div>
    <p id="empty">暂无任务。粘贴链接开始下载，或切到「扩展捕获」一键下载嗅探到的资源。</p>
  </main>

  <main id="view-cap" hidden>
    <p class="hint">在 Edge 扩展 popup 点「发送到桌面端」，捕获条目会实时出现在这里（本程序需保持运行）。点「下载」自动带上 Cookie/Referer/UA。</p>
    <div id="captures"></div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
